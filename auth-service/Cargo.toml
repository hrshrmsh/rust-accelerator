[package]
name = "auth-service"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.89"
axum = "0.8.6"
axum-extra = { version = "0.12.1", features = ["cookie"] }
chrono = "0.4.42"
color-eyre = "0.6.5"
dashmap = "6.1.0"
dotenvy = "0.15.7"
hyper = "1.8.1"
jsonwebtoken = {version = "10.2.0", features = ["rust_crypto"]}
rand = "0.9.2"
redis = { version = "1.0.5", features = ["tokio-comp"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "cookies"] }
secrecy = {version = "0.10.3", features = ["serde"]}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = [ "runtime-tokio-rustls", "postgres", "migrate"] }
thiserror = "2"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.6", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = {version = "0.3.23", features = ["registry", "env-filter"]}
uuid = { version = "1.18.1", features = ["v4", "serde"] }
validator = "0.20.0"

[dev-dependencies]
fake = "=4.4.0"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
test-context = "0.5.5"
wiremock = "0.6.5"
